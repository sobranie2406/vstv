name: Xiaomi Pad adaptation

on:
  push:
    branches: [fix/xiaomi-pad-interlaced]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and build independent adaptation APK
        run: bash ./gradlew :app:testXiaomiPadArmDebugUnitTest :app:assembleXiaomiPadArmDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vstv-xiaomi-pad-debug
          path: app/build/outputs/apk/xiaomiPadArm/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-test-results
          path: app/build/reports/tests/testXiaomiPadArmDebugUnitTest/
